<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Main purple gradient for the bubble -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.45"/>
    </filter>

    <!-- Inner highlight gradient on check -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9D5FF;stop-opacity:0.9" />
    </linearGradient>

    <!-- Subtle inner glow on bubble surface -->
    <radialGradient id="shineGrad" cx="35%" cy="30%" r="55%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Bubble body: rounded rectangle with tail -->
  <!-- Main shape group with shadow -->
  <g filter="url(#shadow)">
    <!-- Bubble rounded rect -->
    <rect x="8" y="8" width="76" height="62" rx="16" ry="16" fill="url(#bubbleGrad)" />

    <!-- Tail pointing bottom-left (approval signature feel) -->
    <path d="M24 68 L14 88 L42 68 Z" fill="url(#bubbleGrad)" />
  </g>

  <!-- Shine overlay on bubble -->
  <rect x="8" y="8" width="76" height="62" rx="16" ry="16" fill="url(#shineGrad)" />

  <!-- Checkmark — bold, centered, slightly raised -->
  <!-- Stroke-based check for crispness -->
  <polyline
    points="26,44 40,58 66,28"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
